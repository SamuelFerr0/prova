<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Consulta de Candidatos TSE</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header>
    <h1>Consulta de Candidatos TSE - Eleições 2026</h1>
</header>

<main>
    <form method="get" th:action="@{/}" class="filtros">
        <input type="text" name="texto" placeholder="Buscar por nome..." th:value="${textoSelecionado}">

        <select name="cargo">
            <option value="" th:selected="${cargoSelecionado == ''}">Todos</option>
            <option th:each="c : ${cargos}" th:value="${c}" th:text="${c}" th:selected="${c == cargoSelecionado}"></option>
        </select>

        <select name="partido">
            <option value="" th:selected="${partidoSelecionado == ''}">Todos</option>
            <option th:each="p : ${partidos}" th:value="${p}" th:text="${p}" th:selected="${p == partidoSelecionado}"></option>
        </select>

        <button type="submit">Filtrar</button>
        <a th:href="@{/}" class="limpar">Limpar</a>
    </form>

    <p class="resultado-info">
        <span th:text="${totalEncontrado}">0</span> candidato(s) encontrado(s).
    </p>

    <p th:if="${totalEncontrado == 0}" class="sem-resultado">
        Nenhum candidato encontrado com esses filtros.
    </p>

    <section class="grade-candidatos">
        <div class="card" th:each="cand : ${candidatos}">
            <img th:src="@{'/images/candidatos/' + ${cand.nomeArquivoFoto}}"
                 th:alt="${cand.nomeUrna}" class="foto-candidato">

            <div class="card-detalhes">
                <h2 th:text="${cand.nomeUrna}">Nome na Urna</h2>
                <p><strong>Número:</strong> <span th:text="${cand.numero}">00</span></p>
                <p><strong>Cargo:</strong> <span th:text="${cand.cargo}">Cargo</span></p>
                <p><strong>Partido:</strong> <span th:text="${cand.partido}">Partido</span></p>

                <p class="situacao" th:if="${cand.situacaoCandidatura != null and !cand.situacaoCandidatura.isBlank()}"
                   th:text="${cand.situacaoCandidatura}">Situação</p>

                <p class="extra" th:if="${cand.idade > 0}">
                    <span th:text="${cand.idade + ' anos'}">Idade</span>
                </p>

                <p class="extra" th:if="${cand.ocupacao != null and !cand.ocupacao.isBlank()}">
                    <span th:text="${cand.ocupacao}">Ocupação</span>
                </p>

                <p class="extra" th:if="${cand.grauInstrucao != null and !cand.grauInstrucao.isBlank()}">
                    <span th:text="${cand.grauInstrucao}">Escolaridade</span>
                </p>
            </div>
        </div>
    </section>
</main>

</body>
</html>
